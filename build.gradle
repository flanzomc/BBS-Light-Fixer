plugins { id 'fabric-loom' version '1.16.1' }
version='0.2.0-alpha.1'
group='dev.bbslight'
base { archivesName='bbs-light-fixer' }
repositories { mavenCentral(); maven { url='https://api.modrinth.com/maven' } }
configurations { lambBundled }
dependencies {
 minecraft 'com.mojang:minecraft:1.20.4'
 mappings 'net.fabricmc:yarn:1.20.4+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.97.2+1.20.4'
 modImplementation 'maven.modrinth:bbs-fs:qGbGyKHH'
 modImplementation 'maven.modrinth:lambdynamiclights:mrQ8ZiyU'
 // Loom does not discover nested mods in development; the release Lamb JAR bundles both.
 lambBundled 'maven.modrinth:lambdynamiclights:mrQ8ZiyU'
 modRuntimeOnly files(provider { zipTree(configurations.lambBundled.singleFile).matching { include 'META-INF/jars/*.jar' }.files })
 testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
java { toolchain { languageVersion=JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release=17 }
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json') { expand 'version':project.version } }
test { useJUnitPlatform() }
loom { runs { client { if (project.hasProperty('smokeTest')) vmArg '-DbbsLight.selfTest=true' } } }
