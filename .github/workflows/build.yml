name: Build and test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - run: gradle build --console=plain
      - name: Client startup smoke test
        run: |
          set +e
          timeout 240s xvfb-run -a gradle runClient -PsmokeTest --console=plain > client-startup.log 2>&1
          result=$?
          cat client-startup.log
          if [ "$result" != 0 ]; then exit 1; fi
          if grep -E 'MixinApplyError|InvalidInjectionException|InjectionError|Failed to load shader|Could not compile shader|Unhandled game exception' client-startup.log; then exit 1; fi
          grep 'BBS LIGHT PORT STARTUP CHECK PASSED' client-startup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-startup-log
          path: client-startup.log
      - uses: actions/upload-artifact@v4
        with:
          name: bbs-light-fixer-0.2.0-alpha.2
          path: build/libs/bbs-light-fixer-0.2.0-alpha.2.jar
          if-no-files-found: error
